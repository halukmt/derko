<!-- components/card.html: Reusable card template (features + apartments) -->
<template id="card-template">
  <!-- Feature Card Variant -->
  <div class="card h-100 shadow-sm" data-variant="feature">
    <img src="" class="card-img-top d-none" data-img-feature alt="" loading="lazy" />
    <div class="card-body">
      <i class="fa-solid fa-circle-question fa-2x text-primary" aria-hidden="true" data-icon></i>
      <h3 class="h5 mt-3" data-title></h3>
      <p data-text></p>
    </div>
  </div>

  <!-- Apartment Card Variant (initially hidden until cloned) -->
  <div class="card h-100 shadow-sm d-none" data-variant="wohnung">
    <img src="" class="card-img-top" alt="" loading="lazy" data-img />
    <div class="card-body d-flex flex-column">
      <h3 class="h5 card-title" data-title></h3>
      <p class="card-text" data-text></p>
      <div class="mt-auto">
        <a href="#" class="btn" data-button></a>
      </div>
    </div>
  </div>
</template>
