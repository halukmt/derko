  <link rel="canonical" href="kontakt.html" />

  <meta property="og:url" content="kontakt.html" />
  <meta property="og:image" content="assets/img/og-default.svg" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <header id="site-header" class="sticky-top" data-component="header"></header>
    <main id="main" class="py-5">
      <div class="container">
        <h1 class="mb-3" data-i18n="kontakt.headline">Kontakt</h1>
        <p class="lead" data-i18n="kontakt.description">Sie haben Fragen oder möchten eine Wohnung anfragen? Nutzen Sie das Formular oder rufen Sie uns an.</p>

        <form id="contact-form" class="needs-validation" novalidate action="https://formspree.io/f/your-id" method="POST">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="name" class="form-label" data-i18n="kontakt.form.name">Name</label>
              <input type="text" class="form-control" id="name" name="name" required aria-required="true" />
              <div class="invalid-feedback" data-i18n="kontakt.validation.nameRequired">Bitte geben Sie Ihren Namen ein.</div>
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label" data-i18n="kontakt.form.email">E-Mail</label>
              <input type="email" class="form-control" id="email" name="email" required aria-required="true" />
              <div class="invalid-feedback" data-i18n="kontakt.validation.emailRequired">Bitte geben Sie eine gültige E-Mail ein.</div>
            </div>
            <div class="col-md-6">
              <label for="phone" class="form-label" data-i18n="kontakt.form.phone">Telefon</label>
              <input type="tel" class="form-control" id="phone" name="phone" pattern="^[+0-9 /()-]{6,}$" />
              <div class="invalid-feedback" data-i18n="kontakt.validation.phoneInvalid">Bitte geben Sie eine gültige Telefonnummer ein.</div>
            </div>
            <div class="col-12">
              <label for="message" class="form-label" data-i18n="kontakt.form.message">Nachricht</label>
              <textarea class="form-control" id="message" name="message" rows="5" required aria-required="true"></textarea>
              <div class="invalid-feedback" data-i18n="kontakt.validation.messageRequired">Bitte geben Sie eine Nachricht ein.</div>
            </div>
            <div class="col-12">
              <button class="btn btn-primary" type="submit" data-i18n="kontakt.form.submit">Absenden</button>
            </div>
          </div>
        </form>
      </div>
    </main>
    <footer id="site-footer" data-component="footer"></footer>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ContactPage",
      "name": "Kontakt",
      "url": "kontakt.html"
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="assets/js/lang.js" defer></script>
  <script src="assets/js/main.js" defer></script>
  </body>
  </html>
