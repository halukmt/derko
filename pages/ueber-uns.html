<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="ueberUns.headline"></title>
    <link rel="canonical" href="/ueber-uns" />
    <meta
      name="description"
      content="Wir bieten seit über 10 Jahren Monteurzimmer und Wohnungen..."
      data-i18n-meta="ueberUns.description"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src-elem 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; base-uri 'self'; form-action 'self'"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Über uns"
      data-i18n-meta="ueberUns.headline"
    />
    <meta
      property="og:description"
      content="Wir bieten seit über 10 Jahren Monteurzimmer und Wohnungen..."
      data-i18n-meta="ueberUns.description"
    />
    <meta property="og:url" content="/ueber-uns" />
    <meta property="og:image" content="/assets/img/logo/og-default.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <meta name="theme-color" content="#505C61" />
    <link rel="icon" href="/assets/img/logo/favicon.svg" type="image/svg+xml" />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/img/logo/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/img/logo/favicon-32x32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/img/logo/apple-touch-icon.png"
    />
    <link rel="shortcut icon" href="/assets/img/logo/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="mask-icon"
      href="/assets/img/safari-pinned-tab.svg"
      color="#505C61"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <header
      id="site-header"
      class="sticky-top"
      data-component="header"
    ></header>
    <main id="main" class="py-5">
      <div class="container">
        <h1 class="mb-3" data-i18n="ueberUns.headline"></h1>
        <p class="lead" data-i18n="ueberUns.description"></p>
        <figure class="founders-figure my-4 text-center">
          <picture>
            <source type="image/avif" srcset="../assets/img/allgemein/eray_koray-400.avif 400w, ../assets/img/allgemein/eray_koray-800.avif 800w, ../assets/img/allgemein/eray_koray-1200.avif 1200w" />
            <source type="image/webp" srcset="../assets/img/allgemein/eray_koray-400.webp 400w, ../assets/img/allgemein/eray_koray-800.webp 800w, ../assets/img/allgemein/eray_koray-1200.webp 1200w" />
            <img
              src="../assets/img/allgemein/eray_koray.png"
              class="img-fluid rounded shadow-sm founders-img"
              width="1360"
              height="768"
              loading="lazy"
              decoding="async"
              data-i18n-alt="ueberUns.founders.alt"
              alt="Gründer"
            />
          </picture>
          <figcaption
            class="mt-2 small text-muted"
            data-i18n="ueberUns.founders.caption"
          ></figcaption>
        </figure>
        <section
          class="row g-4 mt-4"
          id="about-cards"
          aria-label="Vorteile"
        ></section>

        <!-- Partners: manual slider (no auto-scroll) -->
        <section class="partners-section" aria-labelledby="partners-title">
          <h2
            id="partners-title"
            class="h5 mb-3"
            data-i18n="ueberUns.partners.title"
          ></h2>
          <div class="partners-band" role="region" aria-label="Partner Logos">
            <button
              class="partners-control partners-prev"
              type="button"
              aria-label="Zurück"
              title="Zurück"
            ></button>
            <div
              class="partners-viewport"
              tabindex="0"
              aria-roledescription="carousel"
              aria-label="Partnerlogos"
              aria-live="polite"
            >
              <div class="partners-track" data-mode="manual">
                <a class="partners-item" href="https://monteurzimmer.immo/" aria-label="Monteurzimmer Immo" target="_blank"
                  ><img
                    src="../assets/img/partner/DIM_Monteurzimmer.png"
                    alt="Monteurzimmer Immo"
                    loading="lazy"
                    decoding="async"
                /></a>
                <a
                  class="partners-item" href="https://www.techsulting.de/" aria-label="TechSulting" target="_blank"
                  ><img
                    src="../assets/img/partner/TechSulting.png"
                    alt="TechSulting"
                    loading="lazy"
                    decoding="async"
                /></a>
                <a class="partners-item" href="https://monteurzimmer.immo/" aria-label="Monteurzimmer Immo" target="_blank"
                  ><img
                    src="../assets/img/partner/DIM_Monteurzimmer.png"
                    alt="Monteurzimmer Immo"
                    loading="lazy"
                    decoding="async"
                /></a>
                <a
                  class="partners-item" href="https://www.techsulting.de/" aria-label="TechSulting" target="_blank"
                  ><img
                    src="../assets/img/partner/TechSulting.png"
                    alt="TechSulting"
                    loading="lazy"
                    decoding="async"
                /></a>
                <a class="partners-item" href="https://monteurzimmer.immo/" aria-label="Monteurzimmer Immo" target="_blank"
                  ><img
                    src="../assets/img/partner/DIM_Monteurzimmer.png"
                    alt="Monteurzimmer Immo"
                    loading="lazy"
                    decoding="async"
                /></a>
                <a
                  class="partners-item" href="https://www.techsulting.de/" aria-label="TechSulting" target="_blank"
                  ><img
                    src="../assets/img/partner/TechSulting.png"
                    alt="TechSulting"
                    loading="lazy"
                    decoding="async"
                /></a>
                <a class="partners-item" href="https://monteurzimmer.immo/" aria-label="Monteurzimmer Immo" target="_blank"
                  ><img
                    src="../assets/img/partner/DIM_Monteurzimmer.png"
                    alt="Monteurzimmer Immo"
                    loading="lazy"
                    decoding="async"
                /></a>
                <a
                  class="partners-item" href="https://www.techsulting.de/" aria-label="TechSulting" target="_blank"
                  ><img
                    src="../assets/img/partner/TechSulting.png"
                    alt="TechSulting"
                    loading="lazy"
                    decoding="async"
                /></a>
              </div>
            </div>
            <button
              class="partners-control partners-next"
              type="button"
              aria-label="Weiter"
              title="Weiter"
            ></button>
          </div>
        </section>
      </div>
    </main>
    <footer id="site-footer" data-component="footer"></footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/lang.js" defer></script>
    <script src="../assets/js/main.js" defer></script>
    <script src="../assets/js/partners.js" defer></script>
  </body>
</html>
