<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="kontakt.headline"></title>
  <link rel="canonical" href="/kontakt" />
    <meta
      name="description"
      content="Sie haben Fragen oder möchten eine Wohnung anfragen? Nutzen Sie das Formular oder rufen Sie uns an."
      data-i18n-meta="kontakt.description"
    />
    <meta
      http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src-elem 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; base-uri 'self'; form-action 'self' https://formspree.io"
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Kontakt"
      data-i18n-meta="kontakt.headline"
    />
    <meta
      property="og:description"
      content="Sie haben Fragen oder möchten eine Wohnung anfragen?"
      data-i18n-meta="kontakt.description"
    />
  <meta property="og:url" content="/kontakt" />
  <meta property="og:image" content="/assets/img/logo/og-default.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  <meta name="theme-color" content="#505C61" />
  <link rel="icon" href="/assets/img/logo/favicon.svg" type="image/svg+xml" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/logo/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/logo/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/logo/apple-touch-icon.png" />
  <link rel="shortcut icon" href="/assets/img/logo/favicon.ico" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="mask-icon" href="/assets/img/safari-pinned-tab.svg" color="#505C61" />
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <header
      id="site-header"
      class="sticky-top"
      data-component="header"
    ></header>
    <main id="main" class="py-5">
      <div class="container">
        <h1 class="mb-3" data-i18n="kontakt.headline"></h1>
        <p class="lead" data-i18n="kontakt.description"></p>
        <form
          id="contact-form"
          class="needs-validation"
          novalidate
          action="https://formspree.io/f/your-id"
          method="POST"
        >
          <div class="row g-3">
            <div class="col-md-6">
              <label for="name" class="form-label" data-i18n="kontakt.form.name"></label
              ><input
                type="text"
                class="form-control"
                id="name"
                name="name"
                autocomplete="name"
                required
                aria-required="true"
              />
              <div
                class="invalid-feedback"
                data-i18n="kontakt.validation.nameRequired">
              </div>
            </div>
            <div class="col-md-6">
              <label
                for="email"
                class="form-label"
                data-i18n="kontakt.form.email"
                ></label
              ><input
                type="email"
                class="form-control"
                id="email"
                name="email"
                autocomplete="email"
                required
                aria-required="true"
              />
              <div
                class="invalid-feedback"
                data-i18n="kontakt.validation.emailRequired"
              >
              </div>
            </div>
            <div class="col-md-6">
              <label
                for="phone"
                class="form-label"
                data-i18n="kontakt.form.phone"
                ></label
              ><input
                type="tel"
                class="form-control"
                id="phone"
                name="phone"
                autocomplete="tel"
                pattern="^[+0-9 /()-]{6,}$"
              />
              <div
                class="invalid-feedback"
                data-i18n="kontakt.validation.phoneInvalid"
              >
              </div>
            </div>
            <div class="col-md-3">
              <label for="date_from" class="form-label" data-i18n="kontakt.form.dateFrom"></label>
              <input type="date" class="form-control" id="date_from" name="date_from" />
            </div>
            <div class="col-md-3">
              <label for="date_to" class="form-label" data-i18n="kontakt.form.dateTo"></label>
              <input type="date" class="form-control" id="date_to" name="date_to" />
            </div>
            <div class="col-md-6">
              <label for="topic" class="form-label" data-i18n="kontakt.form.topic"></label>
              <select id="topic" name="topic" class="form-select">
                <option value="booking" data-i18n="kontakt.form.topicBooking"></option>
                <option value="other" data-i18n="kontakt.form.topicOther"></option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="apartment" class="form-label" data-i18n="kontakt.form.apartment"></label>
              <select id="apartment" name="apartment" class="form-select">
                <option value="" data-i18n="kontakt.form.apartmentPlaceholder"></option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="persons" class="form-label" data-i18n="kontakt.form.persons"></label>
              <select id="persons" name="persons" class="form-select">
                <option value="" data-i18n="kontakt.form.personsPlaceholder"></option>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
                <option value="6">6</option>
                <option value="7">7</option>
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
              </select>
            </div>
            <div class="col-12">
              <label
                for="message"
                class="form-label"
                data-i18n="kontakt.form.message"
                ></label
              ><textarea
                class="form-control"
                id="message"
                name="message"
                rows="5"
                required
                aria-required="true"
              ></textarea>
              <div
                class="invalid-feedback"
                data-i18n="kontakt.validation.messageRequired"
              >
              </div>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="1" id="privacy" name="privacy" required aria-required="true" />
                <label class="form-check-label" for="privacy" data-i18n="kontakt.form.privacyConsent"></label>
                <div class="invalid-feedback" data-i18n="kontakt.validation.privacyRequired"></div>
              </div>
            </div>
            <div class="col-12">
              <button class="btn" type="submit" data-i18n="kontakt.form.submit">
              </button>
            </div>
          </div>
        </form>
      </div>
    </main>
    <footer id="site-footer" data-component="footer"></footer>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ContactPage",
        "name": "Kontakt",
        "url": "/pages/kontakt.html"
      }
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../assets/js/lang.js" defer></script>
    <script src="../assets/js/main.js" defer></script>
    <script>
    // Dynamische Befüllung der Wohnung-Auswahl nach i18n Laden
    document.addEventListener('i18n:ready', populateApartmentSelect);
    document.addEventListener('i18n:changed', populateApartmentSelect);
    function populateApartmentSelect(){
      const sel = document.getElementById('apartment');
      if(!sel || !window.translateKey) return;
      // Entferne alte dynamische Optionen (alles außer erster Placeholder)
      Array.from(sel.options).forEach((opt,i)=>{ if(i>0) opt.remove(); });
      const keys = ['rahm','duisburg','bonn']; // bekannte Keys; könnte aus einer zentralen Config stammen
      keys.forEach(k=>{
        const title = window.translateKey('wohnungen.cards.'+k+'.title') || k;
        const opt = document.createElement('option');
        opt.value = k; opt.textContent = title;
        sel.appendChild(opt);
      });
    }
    </script>
  </body>
</html>
