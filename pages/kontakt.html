  <body>
    <header
      id="site-header"
      class="sticky-top"
      data-component="header"
    ></header>
    <main id="main" class="py-5">
      <div class="container">
        <h1 class="mb-3" data-i18n="kontakt.headline"></h1>
        <p class="lead" data-i18n="kontakt.description"></p>
        <form
          id="contact-form"
          class="needs-validation"
          novalidate
          action="/api/sendmail.php"
          method="POST"
        >
          <div id="form-alert" class="alert alert-warning d-none" role="alert" aria-live="polite"></div>
          <input type="hidden" id="lang" name="lang" value="" />
          <!-- Bot protection helpers: honeypot + JS flags (no inline styles due to CSP) -->
          <input type="text" id="company" name="company" class="d-none" autocomplete="off" tabindex="-1" aria-hidden="true" />
          <input type="hidden" id="js_enabled" name="js_enabled" value="" />
          <input type="hidden" id="form_ts" name="form_ts" value="" />
          <input type="hidden" id="csrf_token" name="csrf_token" value="" />
          <div class="row g-3">
            <div class="col-md-6">
              <label for="name" class="form-label" data-i18n="kontakt.form.name"></label
              ><input
                type="text"
                class="form-control"
                id="name"
                name="name"
                autocomplete="name"
                required
                aria-required="true"
              />
              <div
                class="invalid-feedback"
                data-i18n="kontakt.validation.nameRequired">
              </div>
            </div>
            <div class="col-md-6">
              <label
                for="email"
                class="form-label"
                data-i18n="kontakt.form.email"
                ></label
              ><input
                type="email"
                class="form-control"
                id="email"
                name="email"
                autocomplete="email"
                required
                aria-required="true"
              />
              <div
                class="invalid-feedback"
                data-i18n="kontakt.validation.emailRequired"
              >
              </div>
            </div>
            <div class="col-md-6">
              <label
                for="phone"
                class="form-label"
                data-i18n="kontakt.form.phone"
                ></label
              ><input
                type="tel"
                class="form-control"
                id="phone"
                name="phone"
                autocomplete="tel"
                inputmode="tel"
                minlength="6"
                pattern="^[0-9()\+\-\s]{6,}$"
                title="Mindestens 6 Zeichen, Ziffern und + ( ) - erlaubt"
                required
                aria-required="true"
              />
              <div
                class="invalid-feedback"
                data-i18n="kontakt.validation.phoneInvalid"
              >
              </div>
            </div>
            <div class="col-md-6">
              <label for="topic" class="form-label" data-i18n="kontakt.form.topic"></label>
              <select id="topic" name="topic" class="form-select" required aria-required="true">
                <option value="booking" data-i18n="kontakt.form.topicBooking"></option>
                <option value="other" data-i18n="kontakt.form.topicOther"></option>
              </select>
            </div>
            <div class="col-md-3" data-booking-only>
              <label for="date_from" class="form-label" data-i18n="kontakt.form.dateFrom"></label>
              <input type="text" class="form-control" id="date_from" name="date_from" placeholder="tt.mm.jjjj" required aria-required="true" />
            </div>
            <div class="col-md-3" data-booking-only>
              <label for="date_to" class="form-label" data-i18n="kontakt.form.dateTo"></label>
              <input type="text" class="form-control" id="date_to" name="date_to" placeholder="tt.mm.jjjj" required aria-required="true" />
            </div>
            <div class="col-md-3" data-booking-only>
              <label for="apartment" class="form-label" data-i18n="kontakt.form.apartment"></label>
              <select id="apartment" name="apartment" class="form-select" required aria-required="true">
                <option value="" data-i18n="kontakt.form.apartmentPlaceholder"></option>
              </select>
            </div>
            <div class="col-md-3" data-booking-only>
              <label for="persons" class="form-label" data-i18n="kontakt.form.persons"></label>
              <input type="number" class="form-control" id="persons" name="persons" inputmode="numeric" pattern="[0-9]*" min="1" step="1" required aria-required="true" aria-describedby="personsHelp personsFeedback" />
              <div id="personsHelp" class="form-text" data-i18n="kontakt.form.personsPlaceholder"></div>
              <div id="personsFeedback" class="invalid-feedback" data-i18n="kontakt.validation.personsRequired"></div>
            </div>
            <div class="col-12">
              <label
                for="message"
                class="form-label"
                data-i18n="kontakt.form.message"
                ></label
              ><textarea
                class="form-control"
                id="message"
                name="message"
                rows="5"
                required
                aria-required="true"
              ></textarea>
              <div
                class="invalid-feedback"
                data-i18n="kontakt.validation.messageRequired"
              >
              </div>
            </div>
            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="1" id="privacy" name="privacy" required aria-required="true" />
                <label class="form-check-label" for="privacy" data-i18n="kontakt.form.privacyConsent"></label>
                <div class="invalid-feedback" data-i18n="kontakt.validation.privacyRequired"></div>
              </div>
            </div>
            <div class="col-md-6">
              <label for="captcha" class="form-label" data-i18n="kontakt.form.captchaLabel"></label>
              <div class="d-flex align-items-center gap-2 mb-1">
                <input type="text" class="form-control" id="captcha" name="captcha" autocomplete="off" inputmode="text" required aria-required="true" />
                <img id="captcha-img" src="/api/captcha.php" alt="CAPTCHA" width="120" height="40" class="rounded border flex-shrink-0" />
                <button type="button" id="captcha-refresh" class="icon-circle flex-shrink-0" aria-label="Neu laden">
                  <i class="fa-solid fa-rotate" aria-hidden="true"></i>
                  <span class="visually-hidden" data-i18n="kontakt.form.captchaRefresh"></span>
                </button>
              </div>
              <div class="captcha-help" data-i18n="kontakt.form.captchaHelp"></div>
              <div class="invalid-feedback" data-i18n="kontakt.validation.captcha"></div>
            </div>
            <div class="col-12">
              <button class="btn" type="submit" data-i18n="kontakt.form.submit">
              </button>
            </div>
          </div>
        </form>
      </div>
