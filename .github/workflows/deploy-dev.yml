name: Deploy dev → SFTP /dev/

on:
  push:
    branches:
      - dev
  workflow_dispatch:  # allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install rsync and sshpass
        run: sudo apt-get install -y rsync sshpass

      - name: Deploy via rsync over SSH to /dev/
        run: |
          sshpass -p "${{ secrets.SFTP_PASSWORD }}" rsync -avz \
            --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='playwright-report/' \
            --exclude='playwright-results/' \
            --exclude='test-results/' \
            --exclude='docker-compose*.yml' \
            --exclude='Dockerfile*' \
            --exclude='.env*' \
            --exclude='package-lock.json' \
            --exclude='.ftp-deploy-sync-state.json' \
            -e "ssh -p 22 -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SFTP_USER }}@${{ secrets.SFTP_HOST }}:/dev/
