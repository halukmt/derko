<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="wohnungen.headline">Unsere Wohnungen</title>
  <link rel="canonical" href="wohnungen.html" />
    <meta name="description" content="Wählen Sie aus verschiedenen Unterkünften – alle vollständig ausgestattet und zentral gelegen." data-i18n-meta="wohnungen.description" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Unsere Wohnungen" data-i18n-meta="wohnungen.headline" />
    <meta property="og:description" content="Wählen Sie aus verschiedenen Unterkünften – alle vollständig ausgestattet und zentral gelegen." data-i18n-meta="wohnungen.description" />
  <meta property="og:url" content="wohnungen.html" />
  <meta property="og:image" content="assets/img/og-default.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkfG4Bb9JfQFfFqEhW8W8qK8Yb0v9N2WZK+o3Zr5p0r1r8R3wR3Q6V4Yg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
  <header id="site-header" class="sticky-top" data-component="header"></header>
    <main id="main" class="py-5">
      <div class="container">
        <h1 class="mb-3" data-i18n="wohnungen.headline">Unsere Wohnungen</h1>
        <p class="lead" data-i18n="wohnungen.description">Wählen Sie aus verschiedenen Unterkünften – alle vollständig ausgestattet und zentral gelegen.</p>

        <div class="row g-4" id="wohnung-list">
          <!-- Example card using component template -->
        </div>
      </div>
    </main>
  <footer id="site-footer" data-component="footer"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="assets/js/lang.js" defer></script>
  <script src="assets/js/main.js" defer></script>
    <script>
      // Render example cards using the reusable component
      document.addEventListener('i18n:ready', () => {
        const container = document.getElementById('wohnung-list');
        if (!container) return;
        const count = 3; // Show 3 sample cards
        for (let i = 0; i < count; i++) {
          const wrapper = document.createElement('div');
          wrapper.className = 'col-md-4';
          wrapper.setAttribute('data-component', 'card');
          wrapper.setAttribute('data-i18n-scope', 'wohnungen.card');
          wrapper.innerHTML = document.getElementById('card-template')?.innerHTML || '';
          container.appendChild(wrapper);
        }
        // initialize i18n for newly added nodes
        if (window.applyTranslations) window.applyTranslations();
      });
    </script>
    <!-- Card template (hidden) -->
    <template id="card-template">
      <div class="card h-100 shadow-sm">
        <img src="assets/img/sample.svg" class="card-img-top" alt="Wohnungsbild" loading="lazy" />
        <div class="card-body d-flex flex-column">
          <h3 class="h5 card-title" data-i18n="wohnungen.card.title">Beispielwohnung</h3>
          <p class="card-text" data-i18n="wohnungen.card.text">Moderne Wohnung mit 3 Betten, Küche, WLAN und Parkplatz.</p>
          <div class="mt-auto">
            <a href="#" class="btn btn-outline-primary" data-i18n="wohnungen.card.button">Details ansehen</a>
          </div>
        </div>
      </div>
    </template>
    <!-- Structured Data: example Apartment as placeholder -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "Unsere Wohnungen",
      "hasPart": [{
        "@type": "Apartment",
        "name": "Beispielwohnung",
        "description": "Moderne Wohnung mit 3 Betten, Küche, WLAN und Parkplatz.",
        "amenityFeature": [
          {"@type": "LocationFeatureSpecification","name": "WLAN","value": true},
          {"@type": "LocationFeatureSpecification","name": "Küche","value": true},
          {"@type": "LocationFeatureSpecification","name": "Parkplatz","value": true}
        ]
      }]
    }
    </script>
  </body>
  </html>
