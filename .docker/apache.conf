ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html

    # AllowOverride All is critical: makes Apache honour .htaccess in every subdirectory.
    # This activates mod_rewrite pretty-URL rules, 301 redirects, security headers,
    # cache headers, MIME types for AVIF/WebP — mirroring the Strato server setup exactly.
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
